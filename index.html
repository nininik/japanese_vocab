<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 단어카드 (CSV 대량 등록 지원)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', AppleSDGothicNeo-Medium, sans-serif; }
    body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 30px 24px; text-align: center; }
    h1 { font-size: 1.5rem; color: #2c3e50; margin-bottom: 8px; }
    .subtitle { color: #6c757d; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
    .btn { background: #4a90e2; color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 0.98rem; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 12px; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .btn-desc { font-size: 0.75rem; font-weight: normal; opacity: 0.85; }
    .btn:hover { background: #357abd; }
    .btn-secondary { background: #6c757d; }
    .btn-bookmark { background: #f39c12; }
    .file-box { background: #f8f9fa; border: 2px dashed #ced4da; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    .file-input { display: none; }
    .file-label { cursor: pointer; color: #4a90e2; font-weight: bold; font-size: 0.9rem; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .home-btn { background: #eef2f7; border: 1px solid #d1d9e6; color: #2c3e50; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .card-container { perspective: 1000px; margin: 15px 0 20px 0; height: 230px; cursor: pointer; }
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .card.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .card-front { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .card-back { background: #ffffff; color: #2c3e50; border: 2px solid #667eea; transform: rotateY(180deg); }
    .card-top-btns { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 10; }
    .icon-btn { background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.4); color: white; width: 42px; height: 42px; border-radius: 50%; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .icon-btn.active { background: #ffd700; color: #333; border-color: #ffd700; }
    .jp-text { font-size: 2.2rem; font-weight: bold; margin-bottom: 8px; }
    .reading { font-size: 1.1rem; opacity: 0.9; }
    .kr-text { font-size: 1.6rem; font-weight: bold; color: #e74c3c; }
    .progress-bar { width: 100%; height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
    .progress-fill { height: 100%; background: #4a90e2; width: 0%; transition: width 0.3s; }
    .status { font-size: 0.85rem; color: #6c757d; }
    .action-btns { display: flex; gap: 10px; margin-top: 15px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- 메인 카테고리 화면 -->
  <div id="screen-select">
    <h1>🇯🇵 일본어 단어카드</h1>
    <p class="subtitle">학습할 메뉴를 선택하세요.</p>
    
    <!-- CSV 파일 업로드 영역 -->
    <div class="file-box">
      <label for="csv-file" class="file-label">📁 나만의 CSV 단어 파일 업로드</label>
      <input type="file" id="csv-file" class="file-input" accept=".csv" onchange="handleCSV(this)">
      <div id="file-info" style="font-size: 0.8rem; color: #6c757d; margin-top: 5px;">기본 데이터 세트 사용 중</div>
    </div>

    <button class="btn" onclick="startQuiz('daily')">
      🗣️ N4 수준 일상 생활회화
      <span class="btn-desc">쇼핑, 길 찾기, 의사 표현, 감정 등</span>
    </button>
    <button class="btn" onclick="startQuiz('business')" style="background: #2e7d32;">
      💼 N2 수준 일반 비즈니스
      <span class="btn-desc">클라이언트 미팅, 이메일, 업무 협의 등</span>
    </button>
    <button id="btn-my-words" class="btn btn-bookmark" onclick="startQuiz('my_words')">
      ⭐ 나만의 단어장 (0개)
      <span class="btn-desc">내가 별표(★)한 단어만 복습하기</span>
    </button>
  </div>

  <!-- 카드 학습 화면 -->
  <div id="screen-quiz" class="hidden">
    <div class="top-nav">
      <button class="home-btn" onclick="showSelect()">🏠 첫페이지</button>
      <span id="cat-label" class="status">카테고리</span>
      <span id="card-count" class="status">1 / 10</span>
    </div>

    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div class="card-container" onclick="flipCard()">
      <div id="card" class="card">
        <div class="card-face card-front">
          <div class="card-top-btns">
            <button id="star-btn" class="icon-btn" onclick="toggleBookmark(event)">☆</button>
            <button class="icon-btn" onclick="speakCurrentJp(event)">🔊</button>
          </div>
          <div id="jp-text" class="jp-text">約束</div>
          <div id="reading-text" class="reading">やくそく</div>
          <div style="font-size: 0.85rem; margin-top: 12px; opacity: 0.75;">💡 카드를 클릭하면 정답이 보여요!</div>
        </div>
        <div class="card-face card-back">
          <div id="kr-text" class="kr-text">약속</div>
        </div>
      </div>
    </div>

    <div class="action-btns">
      <button class="btn btn-secondary" onclick="prevCard()" style="padding: 12px;">이전</button>
      <button class="btn" onclick="nextCard()" style="padding: 12px;">다음 카드 ➔</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="screen-result" class="hidden">
    <h1>🎉 학습 완료!</h1>
    <p style="margin: 20px 0; font-size: 1.1rem; color: #2c3e50;">10개 단어 학습을 완료했습니다.</p>
    <button class="btn" onclick="restartQuiz()">다시 학습하기</button>
    <button class="btn btn-secondary" onclick="showSelect()">🏠 첫페이지로 이동</button>
  </div>
</div>

<script>
  let allVocab = [];
  let bookmarkedIds = JSON.parse(localStorage.getItem('jp_saved_words') || '[]');
  let currentCategory = '';
  let quizList = [];
  let currentIndex = 0;

  // 기본 수록 단어 (CSV를 업로드하지 않았을 때 사용)
  const defaultVocab = [
    { id: "d1", category: "daily", jp: "交差点", reading: "こうさてん", kr: "교차로 / 사거리 (길 찾기)" },
    { id: "d2", category: "daily", jp: "試着", reading: "しちゃく", kr: "시착 / 입어봄 (쇼핑)" },
    { id: "d3", category: "daily", jp: "嬉しい", reading: "うれしい", kr: "기쁘다 (감정)" },
    { id: "d4", category: "daily", jp: "賛成", reading: "さんせい", kr: "찬성 (의사 표현)" },
    { id: "d5", category: "daily", jp: "予約", reading: "よやく", kr: "예약" },
    { id: "b1", category: "business", jp: "検討", reading: "けんとう", kr: "검토 (비즈니스)" },
    { id: "b2", category: "business", jp: "件名", reading: "けんめい", kr: "제목 (이메일)" },
    { id: "b3", category: "business", jp: "打ち合わせ", reading: "うちあわせ", kr: "사전 미팅 / 회의" },
    { id: "b4", category: "business", jp: "提案", reading: "ていあん", kr: "제안" },
    { id: "b5", category: "business", jp: "契約", reading: "けいやく", kr: "계약" }
  ];

  allVocab = [...defaultVocab];
  updateBookmarkCount();

  // CSV 파싱 및 로드
  function handleCSV(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const lines = text.split('\n');
      const loadedData = [];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const [category, jp, reading, kr] = line.split(',');
        if (jp && kr) {
          loadedData.push({
            id: `csv_${i}`,
            category: category ? category.trim() : 'daily',
            jp: jp.trim(),
            reading: reading ? reading.trim() : jp.trim(),
            kr: kr.trim()
          });
        }
      }

      if (loadedData.length > 0) {
        allVocab = loadedData;
        document.getElementById('file-info').innerText = `✅ ${file.name} (${loadedData.length}개 단어 적용됨)`;
        alert(`${loadedData.length}개의 단어가 정상적으로 등록되었습니다!`);
      }
    };
    reader.readAsText(file, 'UTF-8');
  }

  function updateBookmarkCount() {
    const btn = document.getElementById('btn-my-words');
    btn.innerHTML = `⭐ 나만의 단어장 (${bookmarkedIds.length}개)<span class="btn-desc">내가 별표(★)한 단어만 복습하기</span>`;
  }

  function showSelect() {
    updateBookmarkCount();
    document.getElementById('screen-select').classList.remove('hidden');
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
  }

  function startQuiz(category) {
    currentCategory = category;
    
    if (category === 'my_words') {
      if (bookmarkedIds.length === 0) {
        alert('저장된 단어가 없습니다! 카드의 별(☆) 버튼을 눌러 추가해 보세요.');
        return;
      }
      quizList = allVocab.filter(item => bookmarkedIds.includes(item.id));
      document.getElementById('cat-label').innerText = '⭐ 나만의 단어장';
    } else {
      const filtered = allVocab.filter(item => item.category === category);
      if (filtered.length === 0) {
        alert('해당 카테고리에 등록된 단어가 없습니다.');
        return;
      }
      quizList = [...filtered].sort(() => Math.random() - 0.5).slice(0, 10);
      document.getElementById('cat-label').innerText = category === 'daily' ? '🗣️ N4 일상 회화' : '💼 N2 비즈니스';
    }

    currentIndex = 0;
    document.getElementById('screen-select').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    renderCard();
  }

  function renderCard() {
    const item = quizList[currentIndex];
    const cardEl = document.getElementById('card');
    cardEl.classList.remove('flipped');

    setTimeout(() => {
      document.getElementById('jp-text').innerText = item.jp;
      document.getElementById('reading-text').innerText = item.reading;
      document.getElementById('kr-text').innerText = item.kr;
      
      const isSaved = bookmarkedIds.includes(item.id);
      const starBtn = document.getElementById('star-btn');
      starBtn.innerText = isSaved ? '★' : '☆';
      starBtn.className = isSaved ? 'icon-btn active' : 'icon-btn';

      document.getElementById('card-count').innerText = `${currentIndex + 1} / ${quizList.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / quizList.length) * 100}%`;
    }, 150);
  }

  function toggleBookmark(event) {
    event.stopPropagation();
    const currentItem = quizList[currentIndex];
    const index = bookmarkedIds.indexOf(currentItem.id);

    if (index > -1) {
      bookmarkedIds.splice(index, 1);
    } else {
      bookmarkedIds.push(currentItem.id);
    }

    localStorage.setItem('jp_saved_words', JSON.stringify(bookmarkedIds));
    renderCard();
    updateBookmarkCount();
  }

  function speakCurrentJp(event) {
    event.stopPropagation();
    if ('speechSynthesis' in window) {
      const item = quizList[currentIndex];
      const utterance = new SpeechSynthesisUtterance(item.reading || item.jp);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }
  }

  function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
  function nextCard() {
    if (currentIndex < quizList.length - 1) { currentIndex++; renderCard(); }
    else { document.getElementById('screen-quiz').classList.add('hidden'); document.getElementById('screen-result').classList.remove('hidden'); }
  }
  function prevCard() { if (currentIndex > 0) { currentIndex--; renderCard(); } }
  function restartQuiz() { startQuiz(currentCategory); }
</script>
</body>
</html>
